name: Render documentation

# see https://github.com/actions/setup-python#using-setup-python-with-a-self-hosted-runner
# for artifact handling and SBOM: https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts

on:
  push:
  #pull_request: # Not necessary, as it is already been executed on push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip' # caching pip dependencies
    - name: print versions for debugging
      run: python --version ; pip --version ; whoami ; pwd
    - name: Install dependencies
      run: |
        python -m pip install sphinx-lint
    - name: Linting
      run: |
        sphinx-lint
    - name: Check drawsvg output filenames
      run: |
        python tools/check_drawsvg_names.py

  build-html:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip' # caching pip dependencies
    - name: print versions for debugging
      run: python --version ; pip --version ; whoami ; pwd
    - name: Setup environment
      run: ./tools/setup.sh
    - name: Build HTML
      run: |
        source .venv/bin/activate
        make html
    - name: Archive HTML
      uses: actions/upload-artifact@v6
      with:
        name: sphinx-html
        path: ./src/_build/html
        if-no-files-found: error

  build-pdf:
    # Ubuntu 26.04 ships Pango 1.57.0, which segfaults in
    # pango_layout_get_line_readonly (https://gitlab.gnome.org/GNOME/pango/-/issues/862).
    # Pin to 24.04 (Pango 1.52.1) until the Pango bug is fixed.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip' # caching pip dependencies
    - name: print versions for debugging
      run: python --version ; pip --version ; whoami ; pwd
    - name: Install WeasyPrint system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
          libharfbuzz0b libfontconfig1 libgdk-pixbuf-2.0-0 libffi-dev \
          fonts-noto-color-emoji unifont fonts-liberation fonts-freefont-ttf
    - name: Setup environment
      run: ./tools/setup.sh
    - name: Diagnose PDF toolchain
      run: |
        source .venv/bin/activate
        python --version
        pip show weasyprint pydyf cffi libsass || true
        weasyprint --version || true
        dpkg -l | grep -Ei 'pango|harfbuzz|fontconfig' || true
        fc-cache -f
        echo "fonts covering U+24D8 (circled i):"
        fc-list ':charset=24d8' family | sort -u || true
        echo "fonts covering U+1F3AF (target):"
        fc-list ':charset=1f3af' family | sort -u || true
    - name: Build PDF
      run: |
        source .venv/bin/activate
        make pdf
    - name: Verify PDF exists
      run: |
        PDF=src/_build/simplepdf/open_someip_specification.pdf
        if [ -s "$PDF" ]; then
          echo "PDF OK: $PDF"
          ls -lh "$PDF"
        else
          echo "::error::No PDF produced at $PDF"
          exit 1
        fi
    - name: Archive PDF
      if: ${{ success() }}
      uses: actions/upload-artifact@v6
      with:
        name: sphinx-pdf
        path: ./src/_build/simplepdf/open_someip_specification.pdf
        if-no-files-found: error
    - name: Diagnose PDF crash (faulthandler + gdb backtrace)
      if: ${{ failure() }}
      continue-on-error: true
      run: |
        source .venv/bin/activate
        test -f src/_build/simplepdf/index.html || exit 0
        echo "=== faulthandler Python stack ==="
        PYTHONFAULTHANDLER=1 python -m weasyprint \
          src/_build/simplepdf/index.html /tmp/fh.pdf || true
        echo "=== gdb C backtrace ==="
        sudo apt-get install -y gdb
        PYTHONFAULTHANDLER=1 gdb -batch -ex run -ex bt --args \
          python -m weasyprint \
          src/_build/simplepdf/index.html /tmp/dbg.pdf || true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-html
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: Download HTML artifact
        uses: actions/download-artifact@v7
        with:
          name: sphinx-html
          path: ./public/html
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
